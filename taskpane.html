<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email Drafter</title>
    <style>
        /* Outlook owns the task pane width; this page is an iframe inside it, so
           percentages here resolve against the pane we were given and cannot
           widen it (there is no Outlook API for that either). What the layout
           CAN do is stop wasting the width you drag out: one layer of padding
           instead of two, a full-height flex column so the draft box fills the
           pane, and controls that reflow to a row when there is room. */
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 8px;
            margin: 0;
            background-color: #1e1e1e;
            color: #e0e0e0;
            box-sizing: border-box;
            display: flex;
        }
        .container {
            background: #252525;
            padding: 14px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            flex: 1;
            display: flex;
            flex-direction: column;
            /* min-height:0 lets the draft box shrink inside the flex column
               instead of forcing the whole pane to overflow. */
            min-height: 0;
            overflow-y: auto;
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 20px;
        }
        h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #ffffff;
            font-size: 16px;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #e0e0e0;
        }
        select, button, input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #2d2d2d;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
            line-height: 1.6;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #0078d4;
        }
        button {
            background-color: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #106ebe;
        }
        button:disabled {
            background-color: #3a3a3a;
            color: #666;
            cursor: not-allowed;
        }
        .secondary-btn {
            background-color: #2d2d2d;
            color: #0078d4;
            border: 1px solid #0078d4;
        }
        .secondary-btn:hover {
            background-color: #3a3a3a;
        }
        /* generateDraft() switches this to flex, not block, so the textarea
           below can grow into the leftover pane height. */
        #draftOutput {
            margin-top: 16px;
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        #draftTextarea {
            flex: 1;
            min-height: 120px;
            /* No manual resize handle: it now sizes itself to the pane, and a
               dragged inline height would win over the flex sizing. */
            resize: none;
        }
        /* One row when the pane is wide enough for it, stacked when it is not.
           The 150px basis is the flip point, so it follows the divider. */
        #actionButtons {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
        }
        #actionButtons button {
            flex: 1 1 150px;
            margin: 0;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .status.success {
            background-color: #1a3d1a;
            color: #7cfc7c;
            border: 1px solid #2d5a2d;
        }
        .status.error {
            background-color: #3d1a1a;
            color: #ff6b6b;
            border: 1px solid #5a2d2d;
        }
        .settings-link {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }
        .settings-link a {
            color: #4a9eff;
            text-decoration: none;
            cursor: pointer;
        }
        .settings-link a:hover {
            color: #6eb4ff;
        }
        .view {
            display: none;
        }
        .view.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        /* Only the draft box flexes. Without this the header, picker and
           buttons would compress before the container agreed to scroll. */
        .view.active > *:not(#draftOutput) {
            flex-shrink: 0;
        }
        .back-link {
            color: #4a9eff;
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .back-link:hover {
            color: #6eb4ff;
        }
        .info-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        .model-indicator {
            font-size: 11px;
            color: #888;
            margin-top: 15px;
            padding: 8px;
            background-color: #2d2d2d;
            border-radius: 4px;
            text-align: center;
        }
        .model-indicator strong {
            color: #4a9eff;
        }
        .instruction-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            font-style: italic;
        }
        
        /* Scrollbar styling for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- MAIN VIEW -->
        <div id="mainView" class="view active">
            <h2>✨ Email Drafter</h2>
            
            <div id="modelIndicator" class="model-indicator">
                Currently using: <strong id="modelName">&nbsp;</strong>
            </div>
            
            <label for="toneSelect"><strong>Select Style:</strong></label>
            <select id="toneSelect">
                <optgroup label="🤝 RELATIONSHIP / TONE">
                    <option value="professional">Professional</option>
                    <option value="friendly">Friendly</option>
                    <option value="casual">Casual</option>
                    <option value="brief">Brief</option>
                    <option value="diplomatic">Diplomatic</option>
                </optgroup>
                <optgroup label="⚙️ UTILITY / PERFORMANCE">
                    <option value="cleanup">Cleanup</option>
                    <option value="sales">Sales Upgrade</option>
                </optgroup>
                <optgroup label="🧬 PERSONAL VOICE">
                    <option value="myvoice" selected>My Voice From Notes</option>
                </optgroup>
            </select>

            <button id="generateBtn" onclick="generateDraft()">Generate Draft</button>

            <div id="statusMessage" class="status"></div>

            <div id="draftOutput">
                <label><strong>Draft (editable):</strong></label>
                <textarea id="draftTextarea"></textarea>
                <div class="instruction-text">💡 Replace Body swaps the whole email and keeps your signature. Replace Selection only overwrites highlighted text.</div>
            </div>

            <div id="actionButtons" style="display: none;">
                <button onclick="replaceBody()">Replace Body</button>
                <button class="secondary-btn" onclick="replaceSelection()">Replace Selection</button>
                <button class="secondary-btn" onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>

            <div class="settings-link">
                <a onclick="showSettingsView()">⚙️ Settings</a>
            </div>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="settingsView" class="view">
            <a class="back-link" onclick="showMainView()">← Back</a>

            <h2>⚙️ Settings</h2>

            <label for="claudeKeyInput">Anthropic API Key:</label>
            <input type="password" id="claudeKeyInput" placeholder="sk-ant-...">
            <div class="info-text">Get your key at console.anthropic.com</div>

            <button onclick="saveSettings()" style="margin-top: 20px;">Save Settings</button>

            <div id="settingsStatus" class="status"></div>
        </div>

    </div>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.js"></script>
</body>
</html>
